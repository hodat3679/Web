<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2</title>

<style>
:root{
  --n1:#00ffe1;
  --n2:#ff00ff;
  --n3:#00b7ff;
  --speed:6s;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0a0014,#000),
    repeating-linear-gradient(
      90deg,
      rgba(255,0,255,.04) 0,
      rgba(255,0,255,.04) 1px,
      transparent 1px,
      transparent 4px
    );
  font-family:'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e5f3ff;
  overflow:hidden;
}

/* cyberpunk glow fog */
body::before{
  content:"";
  position:fixed;
  inset:-40%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,255,.25), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,255,225,.25), transparent 40%);
  animation:fogMove 12s linear infinite;
}
@keyframes fogMove{
  0%{transform:translate(0,0)}
  50%{transform:translate(6%,-6%)}
  100%{transform:translate(0,0)}
}

/* container + neon border */
.container{
  position:relative;
  padding:36px;
  width:92%;
  max-width:920px;
  background:rgba(5,0,20,.92);
  border-radius:26px;
  text-align:center;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:26px;
  padding:2px;
  background:conic-gradient(
    from 0deg,
    var(--n2),
    var(--n1),
    var(--n3),
    var(--n2)
  );
  animation:borderSpin var(--speed) linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask-composite:exclude;
}
@keyframes borderSpin{
  to{transform:rotate(360deg)}
}

h1{
  margin-bottom:16px;
  color:var(--n3);
  text-shadow:
    0 0 12px var(--n3),
    0 0 28px var(--n2);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-bottom:20px;
}

.tiktok-btn{
  text-decoration:none;
  padding:22px;
  border-radius:20px;
  font-weight:bold;
  color:#020617;
  background:linear-gradient(90deg,var(--n2),var(--n1));
  box-shadow:
    0 0 22px rgba(255,0,255,.9),
    0 0 36px rgba(0,255,225,.9);
  position:relative;
  overflow:hidden;
  transition:.2s;
}
.tiktok-btn:hover{transform:scale(1.06)}

.tiktok-btn::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3),transparent 70%);
  animation:shine 2.4s infinite;
}
@keyframes shine{
  from{transform:translateX(-60%)}
  to{transform:translateX(60%)}
}

.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow:0 0 26px rgba(34,197,94,.9);
  color:#022c22;
}

.timer{margin-top:8px;font-size:13px}

.controls{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:16px;
}

.ctrl-btn{
  padding:10px 18px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  color:#020617;
  background:linear-gradient(90deg,var(--n3),var(--n1));
  box-shadow:0 0 18px rgba(0,183,255,.9);
}

.loader{display:none;margin-top:16px}
.spinner{
  width:46px;height:46px;margin:auto;
  border:5px solid #020617;
  border-top:5px solid var(--n3);
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 18px rgba(56,189,248,.9);
}
@keyframes spin{to{transform:rotate(360deg)}}

pre{
  display:none;
  margin-top:22px;
  background:#020617;
  padding:20px;
  border-radius:16px;
  color:#7dd3fc;
  font-size:14px;
  overflow-x:auto;
  box-shadow:0 0 30px rgba(0,183,255,.6);
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,var(--n2),var(--n1));
  color:#020617;
  box-shadow:0 0 26px rgba(255,0,255,.9);
}

.footer{
  margin-top:18px;
  font-size:13px;
  opacity:.85;
  text-shadow:0 0 12px var(--n1);
}
</style>
</head>

<body>
<div class="container">
  <h1>⚠️ Follow 2 TikTok Accounts to Unlock Script</h1>

  <div class="controls">
    <button class="ctrl-btn" onclick="setSpeed('slow')">🐢 Slow Neon</button>
    <button class="ctrl-btn" onclick="setSpeed('fast')">⚡ Fast Neon</button>
  </div>

  <div class="grid">
    <a class="tiktok-btn" id="btn1" href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aQ5NP6HP2" target="_blank">
      ⭐ Main TikTok
      <div class="timer" id="t1"></div>
    </a>

    <a class="tiktok-btn" id="btn2" href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aQ7WsrBUi" target="_blank">
      🌙 Sub TikTok
      <div class="timer" id="t2"></div>
    </a>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="margin-top:6px">Unlocking script...</div>
  </div>

  <pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()
  </pre>

  <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© @HdatScript</div>
</div>

<script>
const WAIT_EACH = 3;
let done1=false, done2=false;

function start(btn, timer, mark){
  if(btn.classList.contains("done")) return;
  let t=WAIT_EACH;
  timer.textContent=`Verifying... ${t}s`;
  const iv=setInterval(()=>{
    t--;
    timer.textContent=`Verifying... ${t}s`;
    if(t<=0){
      clearInterval(iv);
      btn.classList.add("done");
      timer.textContent="Followed ✔";
      mark(); check();
    }
  },1000);
}

function check(){
  if(done1 && done2){
    loader.style.display="block";
    setTimeout(()=>{
      loader.style.display="none";
      script.style.display="block";
      copyBtn.style.display="block";
    },900);
  }
}

btn1.onclick=()=>start(btn1,t1,()=>done1=true);
btn2.onclick=()=>start(btn2,t2,()=>done2=true);

function copyScript(){
  navigator.clipboard.writeText(script.innerText)
    .then(()=>alert("Script copied!"));
}

function setSpeed(mode){
  document.documentElement.style.setProperty(
    "--speed",
    mode==="fast" ? "2s" : "6s"
  );
}

window.addEventListener("beforeunload",()=>{
  done1=false;done2=false;
});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(
    e.key==="F12" ||
    (e.ctrlKey && e.key.toLowerCase()==="u") ||
    (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()))
  ){
    e.preventDefault();
  }
});
</script>
</body>
</html>
