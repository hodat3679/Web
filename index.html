<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ScriptMM2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(
      to bottom,
      #da251d 0%,
      #da251d 45%,
      #ffde00 50%,
      #da251d 55%,
      #da251d 100%
    );
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }

  .container {
    width: 90%;
    max-width: 420px;
    background: rgba(0,0,0,0.6);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-top: 0;
  }

  .btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #00ffd5;
    color: black;
    font-weight: bold;
  }

  .btn:disabled {
    background: gray;
    cursor: not-allowed;
  }

  .progress {
    width: 100%;
    height: 12px;
    background: #333;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px 0;
  }

  .bar {
    height: 100%;
    width: 0%;
    background: #00ff88;
    transition: width 0.2s;
  }

  textarea {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    resize: none;
    display: none;
  }

  .copy {
    display: none;
  }

  .credit {
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.8;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Follow TikTok to Unlock MM2Scripts</h1>

  <button id="tiktokBtn" class="btn">
    Follow Main TikTok (5s)
  </button>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <textarea id="script" readonly>
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()
  </textarea>

  <button id="copyBtn" class="btn copy">Copy Script</button>

  <div class="credit">HdatScript</div>
</div>

<script>
const btn = document.getElementById("tiktokBtn");
const bar = document.getElementById("bar");
const script = document.getElementById("script");
const copyBtn = document.getElementById("copyBtn");

btn.onclick = () => {
  window.open("https://www.tiktok.com/@mm2scriptontop", "_blank");
  btn.disabled = true;

  let percent = 0;
  const timer = setInterval(() => {
    percent += 2;
    bar.style.width = percent + "%";

    if (percent >= 100) {
      clearInterval(timer);
      btn.style.display = "none";
      document.querySelector(".progress").style.display = "none";
      script.style.display = "block";
      copyBtn.style.display = "block";
    }
  }, 100);
};

copyBtn.onclick = () => {
  script.select();
  document.execCommand("copy");
  alert("Script copied!");
};
</script>

</body>
</html>
