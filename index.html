<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2</title>

<style>
:root{
  --c1:#00ffe1;
  --c2:#ff00ff;
  --c3:#00b7ff;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0a0014,#000),
    repeating-linear-gradient(
      90deg,
      rgba(255,0,255,.04) 0,
      rgba(255,0,255,.04) 1px,
      transparent 1px,
      transparent 4px
    );
  font-family:'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e5f3ff;
  overflow:hidden;
}

/* cyberpunk fog */
body::before{
  content:"";
  position:fixed;
  inset:-40%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,255,.22), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,255,225,.22), transparent 40%);
  animation:fogMove 14s linear infinite;
}
@keyframes fogMove{
  0%{transform:translate(0,0)}
  50%{transform:translate(6%,-6%)}
  100%{transform:translate(0,0)}
}

/* container (NO neon border) */
.container{
  padding:36px;
  width:92%;
  max-width:920px;
  background:rgba(5,0,20,.92);
  border-radius:26px;
  text-align:center;
  box-shadow:
    0 0 30px rgba(0,183,255,.35),
    inset 0 0 40px rgba(255,0,255,.12);
}

h1{
  margin-bottom:18px;
  color:var(--c3);
  text-shadow:
    0 0 12px var(--c3),
    0 0 24px var(--c2);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-bottom:20px;
}

.tiktok-btn{
  text-decoration:none;
  padding:22px;
  border-radius:20px;
  font-weight:bold;
  color:#020617;
  background:linear-gradient(90deg,var(--c2),var(--c1));
  box-shadow:
    0 0 22px rgba(255,0,255,.9),
    0 0 36px rgba(0,255,225,.9);
  position:relative;
  overflow:hidden;
  transition:.2s;
}
.tiktok-btn:hover{transform:scale(1.05)}

.tiktok-btn::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3),transparent 70%);
  animation:shine 2.4s infinite;
}
@keyframes shine{
  from{transform:translateX(-60%)}
  to{transform:translateX(60%)}
}

.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow:0 0 26px rgba(34,197,94,.9);
  color:#022c22;
}

.timer{margin-top:8px;font-size:13px}

/* script area */
pre{
  display:none;
  margin-top:22px;
  background:#020617;
  padding:20px;
  border-radius:16px;
  color:#7dd3fc;
  font-size:14px;
  overflow-x:auto;
  text-align:left;
  box-shadow:0 0 28px rgba(0,183,255,.5);
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,var(--c2),var(--c1));
  color:#020617;
  box-shadow:0 0 26px rgba(255,0,255,.9);
}

.footer{
  margin-top:18px;
  font-size:13px;
  opacity:.85;
  text-shadow:0 0 10px var(--c1);
}
</style>
</head>

<body>
<div class="container">
  <h1>Follow 2 TikTok Accounts to Unlock Script</h1>

  <!-- TIKTOK BUTTONS -->
  <div class="grid" id="tiktokGrid">
    <a class="tiktok-btn" id="btn1"
       href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aQ5NP6HP2"
       target="_blank">
      ⭐ Main TikTok
      <div class="timer" id="t1"></div>
    </a>

    <a class="tiktok-btn" id="btn2"
       href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aQ7WsrBUi"
       target="_blank">
      🌙 Sub TikTok
      <div class="timer" id="t2"></div>
    </a>
  </div>

  <!-- SCRIPT (ONLY AFTER UNLOCK) -->
  <pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()
  </pre>

  <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© HdatScript</div>
</div>

<script>
// ===== SOUND (Web Audio API) =====
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function beep(freq, dur){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type="sawtooth";
  o.frequency.value=freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.value=0.08;
  o.start();
  setTimeout(()=>{o.stop()},dur);
}
function clickSound(){ beep(520,120) }
function unlockSound(){ beep(880,180); setTimeout(()=>beep(1320,220),200) }

// ===== LOGIC =====
const WAIT_EACH = 3;
let done1=false, done2=false;

function start(btn, timer, mark){
  if(btn.classList.contains("done")) return;
  clickSound();
  let t=WAIT_EACH;
  timer.textContent=`Verifying... ${t}s`;
  const iv=setInterval(()=>{
    t--;
    timer.textContent=`Verifying... ${t}s`;
    if(t<=0){
      clearInterval(iv);
      btn.classList.add("done");
      timer.textContent="Followed ✔";
      mark(); check();
    }
  },1000);
}

function check(){
  if(done1 && done2){
    unlockSound();
    // HIDE TIKTOK, SHOW SCRIPT ONLY
    document.getElementById("tiktokGrid").style.display="none";
    script.style.display="block";
    copyBtn.style.display="block";
  }
}

btn1.onclick=()=>start(btn1,t1,()=>done1=true);
btn2.onclick=()=>start(btn2,t2,()=>done2=true);

function copyScript(){
  navigator.clipboard.writeText(script.innerText)
    .then(()=>alert("Script copied!"));
}

// reset on reload
window.addEventListener("beforeunload",()=>{
  done1=false; done2=false;
});

// basic source block
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(
    e.key==="F12" ||
    (e.ctrlKey && e.key.toLowerCase()==="u") ||
    (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()))
  ){
    e.preventDefault();
  }
});
</script>
</body>
</html>
