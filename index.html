<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2</title>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
  background:#da251d;
}

/* 🌊 waving flag effect */
.flag{
  position:fixed;
  inset:0;
  background:#da251d;
  animation:wave 8s ease-in-out infinite;
  transform-origin:left center;
  z-index:-2;
}
@keyframes wave{
  0%{transform:skewY(0deg)}
  25%{transform:skewY(-1.5deg)}
  50%{transform:skewY(0deg)}
  75%{transform:skewY(1.5deg)}
  100%{transform:skewY(0deg)}
}

/* ⭐ yellow star */
.star{
  position:fixed;
  width:38vmin;
  max-width:260px;
  aspect-ratio:1;
  z-index:-1;
}

/* container */
.container{
  padding:36px;
  width:92%;
  max-width:920px;
  background:rgba(0,0,0,.55);
  border-radius:26px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}

h1{
  margin-bottom:18px;
  color:#ffd700;
  text-shadow:0 0 12px rgba(255,215,0,.9);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-bottom:20px;
}

/* TikTok buttons */
.tiktok-btn{
  text-decoration:none;
  padding:22px;
  border-radius:20px;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(135deg,#ff004f,#ffcc00);
  box-shadow:0 0 22px rgba(255,0,79,.8);
  transition:.2s;
}
.tiktok-btn:hover{transform:scale(1.05)}

.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow:0 0 22px rgba(34,197,94,.9);
}

.timer{margin-top:8px;font-size:13px;color:#fff}

/* script */
pre{
  display:none;
  margin-top:22px;
  background:#020617;
  padding:20px;
  border-radius:16px;
  color:#7dd3fc;
  font-size:14px;
  overflow-x:auto;
  text-align:left;
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#ffd700,#fff2a8);
  color:#020617;
}

.footer{
  margin-top:18px;
  font-size:13px;
  opacity:.9;
}
</style>
</head>

<body>

<div class="flag"></div>

<!-- ⭐ SVG STAR -->
<svg class="star" viewBox="0 0 100 100">
  <polygon fill="#ffd700"
    points="
    50,5
    61,38
    95,38
    67,58
    78,91
    50,70
    22,91
    33,58
    5,38
    39,38"/>
</svg>

<div class="container">
  <h1>Follow 2 TikTok Accounts to Unlock Script</h1>

  <div class="grid" id="tiktokGrid">
    <a class="tiktok-btn" id="btn1"
       href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aQ5NP6HP2"
       target="_blank">
      ⭐ Main TikTok
      <div class="timer" id="t1"></div>
    </a>

    <a class="tiktok-btn" id="btn2"
       href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aQ7WsrBUi"
       target="_blank">
      🌙 Sub TikTok
      <div class="timer" id="t2"></div>
    </a>
  </div>

  <pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()
  </pre>

  <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© HdatScript</div>
</div>

<script>
const WAIT=3;
let d1=false,d2=false;

function start(btn,timer,done){
  if(btn.classList.contains("done")) return;
  let t=WAIT;
  timer.textContent=`Verifying... ${t}s`;
  const iv=setInterval(()=>{
    t--;
    timer.textContent=`Verifying... ${t}s`;
    if(t<=0){
      clearInterval(iv);
      btn.classList.add("done");
      timer.textContent="Followed ✔";
      done(); check();
    }
  },1000);
}

function check(){
  if(d1 && d2){
    tiktokGrid.style.display="none";
    script.style.display="block";
    copyBtn.style.display="block";
  }
}

btn1.onclick=()=>start(btn1,t1,()=>d1=true);
btn2.onclick=()=>start(btn2,t2,()=>d2=true);

function copyScript(){
  navigator.clipboard.writeText(script.innerText)
    .then(()=>alert("Script copied!"));
}

/* simple source block */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(e.key==="F12"||(e.ctrlKey&&["u","i","j","c"].includes(e.key.toLowerCase()))){
    e.preventDefault();
  }
});
</script>

</body>
</html>
