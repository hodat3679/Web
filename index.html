<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  color:#fff;
  background:#da251d;
  overflow-x:hidden;
}

/* 🇻🇳 FLAG WAVE */
.flag{
  position:fixed;
  inset:0;
  background:#da251d;
  animation:wave 10s ease-in-out infinite;
  transform-origin:left center;
  z-index:-3;
}
@keyframes wave{
  0%{transform:skewY(0deg)}
  25%{transform:skewY(-1deg)}
  50%{transform:skewY(0deg)}
  75%{transform:skewY(1deg)}
  100%{transform:skewY(0deg)}
}

/* ⭐ STAR */
.star{
  position:fixed;
  width:60vmin;
  max-width:380px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:.85;
  z-index:-2;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:720px;
  padding:18px;
}

/* CARD */
.card{
  background:rgba(0,0,0,.55);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,.6);
}

/* TITLE */
h1{
  text-align:center;
  font-size:1.25rem;
  margin-bottom:14px;
  color:#ffd700;
}

/* PROGRESS */
.progress-box{
  margin-bottom:18px;
}
.progress{
  height:14px;
  width:100%;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  transition:width .25s linear;
}
.percent{
  text-align:center;
  margin-top:6px;
  font-size:.85rem;
}

/* TIKTOK */
.tiktok-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.tiktok-btn{
  text-decoration:none;
  padding:18px;
  border-radius:16px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,#ff004f,#ffcc00);
  text-align:center;
}
.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
}
.timer{
  font-size:.8rem;
  margin-top:6px;
}

/* SCRIPT */
pre{
  display:none;
  margin-top:18px;

  border-radius:14px;

  font-size:.8rem;
  overflow-x:auto;
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;

  background:linear-gradient(90deg,#ffd700,#fff2a8);
}

.footer{
  text-align:center;
  margin-top:14px;
  font-size:.75rem;
  opacity:.9;
}

/* DESKTOP */
@media(min-width:768px){
  h1{font-size:1.6rem}
}
</style>
</head>

<body>

<div class="flag"></div>

<svg class="star" viewBox="0 0 100 100">
  <polygon fill="#ffd700"
  points="50,5 61,38 95,38 67,58 78,91 50,70 22,91 33,58 5,38 39,38"/>
</svg>

<div class="container">
  <div class="card">

    <h1>Follow TikTok to Unlock MM2Scripts</h1>

    <!-- PROGRESS -->
    <div class="progress-box">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>

    <!-- TIKTOK -->
    <div class="tiktok-list" id="tiktokGrid">
      <a class="tiktok-btn" id="btn1"
         href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aQ5NP6HP2"
         target="_blank">
        ⭐ Main TikTok
        <div class="timer" id="t1"></div>
      </a>

      <a class="tiktok-btn" id="btn2"
         href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aQ7WsrBUi"
         target="_blank">
        🌙 Sub TikTok
        <div class="timer" id="t2"></div>
      </a>
    </div>

    <!-- SCRIPT -->
    <pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ProjectReverse"))()
    </pre>

    <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

    <div class="footer">© HdatScript</div>
  </div>
</div>

<script>
const WAIT = 5;
let d1=false,d2=false;
let progress=0;

function setProgress(p){
  progress=Math.min(100,p);
  bar.style.width=progress+"%";
  percent.textContent=progress+"%";
}

function start(btn,timer,done){
  if(btn.classList.contains("done")) return;
  let t=WAIT;
  let step=50/WAIT;
  timer.textContent=`Verifying... ${t}s`;
  const iv=setInterval(()=>{
    t--;
    setProgress(progress+step);
    timer.textContent=`Verifying... ${t}s`;
    if(t<=0){
      clearInterval(iv);
      btn.classList.add("done");
      timer.textContent="Followed ✔";
      done();
      setProgress(Math.round(progress/50)*50);
      check();
    }
  },1000);
}

function check(){
  if(d1 && d2){
    tiktokGrid.style.display="none";
    script.style.display="block";
    copyBtn.style.display="block";
    setProgress(100);
  }
}

btn1.onclick=()=>start(btn1,t1,()=>d1=true);
btn2.onclick=()=>start(btn2,t2,()=>d2=true);

function copyScript(){
  navigator.clipboard.writeText(script.innerText.trim())
    .then(()=>alert("Script copied!"));
}

/* basic block */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(e.key==="F12"||(e.ctrlKey&&["u","i","j","c"].includes(e.key.toLowerCase())))
    e.preventDefault();
});
</script>

</body>
</html>
