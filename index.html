<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2</title>

<style>
:root{
  --c1:#00f2ea;
  --c2:#ff0050;
  --c3:#38bdf8;
}

body{
  margin:0; min-height:100vh;
  background:radial-gradient(circle at top,#020617,#000);
  font-family:'Segoe UI',sans-serif;
  display:flex; align-items:center; justify-content:center;
  color:#e5f3ff;
  overflow:hidden;
}

/* nền neon động */
body::before{
  content:"";
  position:fixed; inset:-40%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,242,234,.18), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,80,.18), transparent 40%);
  animation:bgMove 12s linear infinite;
}
@keyframes bgMove{
  0%{transform:translate(0,0)}
  50%{transform:translate(6%, -6%)}
  100%{transform:translate(0,0)}
}

.container{
  position:relative;
  background:rgba(2,6,23,.9);
  padding:32px;
  border-radius:22px;
  width:92%; max-width:900px;
  text-align:center;
  border:1px solid rgba(56,189,248,.35);
  box-shadow:
    0 0 25px rgba(56,189,248,.45),
    inset 0 0 30px rgba(0,242,234,.18);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 22px rgba(56,189,248,.45), inset 0 0 26px rgba(0,242,234,.18)}
  50%{box-shadow:0 0 36px rgba(56,189,248,.75), inset 0 0 36px rgba(255,0,80,.22)}
}

h1{
  color:var(--c3);
  margin-bottom:18px;
  text-shadow:0 0 12px rgba(56,189,248,.9);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-bottom:22px;
}

.tiktok-btn{
  text-decoration:none;
  padding:20px;
  border-radius:18px;
  font-weight:bold;
  color:#020617;
  background:linear-gradient(90deg,var(--c2),var(--c1));
  box-shadow:
    0 0 18px rgba(255,0,80,.9),
    0 0 30px rgba(0,242,234,.8);
  transition:.2s;
  position:relative;
  overflow:hidden;
}
.tiktok-btn::after{
  content:"";
  position:absolute; inset:-50%;
  background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.25), transparent 70%);
  transform:translateX(-60%);
  animation:shine 2.4s infinite;
}
@keyframes shine{
  0%{transform:translateX(-60%)}
  100%{transform:translateX(60%)}
}
.tiktok-btn:hover{ transform:scale(1.04) }

.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow:0 0 26px rgba(34,197,94,.9);
  color:#022c22;
}
.timer{ margin-top:8px; font-size:13px; opacity:.9 }

.loader{ display:none; margin-top:14px; }
.spinner{
  width:48px; height:48px; margin:auto;
  border:5px solid #020617;
  border-top:5px solid var(--c3);
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 18px rgba(56,189,248,.9);
}
@keyframes spin{ to{transform:rotate(360deg)} }

pre{
  display:none; /* KHÓA: chỉ hiện khi đủ 2 acc */
  margin-top:22px;
  background:#020617;
  padding:20px;
  border-radius:16px;
  overflow-x:auto;
  color:#7dd3fc;
  font-size:14px;
  text-align:left;
  box-shadow:0 0 26px rgba(56,189,248,.35);
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  color:#020617;
  background:linear-gradient(90deg,var(--c3),var(--c1));
  box-shadow:0 0 22px rgba(56,189,248,.9);
}

.footer{
  margin-top:16px;
  font-size:13px;
  opacity:.8;
  text-shadow:0 0 10px rgba(0,242,234,.7);
}
</style>
</head>

<body>
<div class="container">
  <h1>🔒 Follow 2 TikTok để mở Script</h1>

  <div class="grid">
    <a class="tiktok-btn" id="btn1" href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aOPNUXzC1" target="_blank">
      ⭐ TikTok Chính
      <div class="timer" id="t1"></div>
    </a>

    <a class="tiktok-btn" id="btn2" href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aOOJfr5Ur" target="_blank">
      🌙 TikTok Phụ
      <div class="timer" id="t2"></div>
    </a>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="font-size:14px;opacity:.9;margin-top:6px">Đang mở script...</div>
  </div>

  <!-- SCRIPT BỊ KHÓA -->
  <pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()
  </pre>

  <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

  <div class="footer">© @HdatScript</div>
</div>

<script>
// ===== CONFIG =====
const WAIT_EACH = 3; // 3s mỗi acc
// ==================

let done1=false, done2=false;

function start(btn, timerEl, markDone){
  if(btn.classList.contains("done")) return;

  let time = WAIT_EACH;
  timerEl.textContent = `Đang xác minh... ${time}s`;

  const iv = setInterval(()=>{
    time--;
    timerEl.textContent = `Đang xác minh... ${time}s`;
    if(time<=0){
      clearInterval(iv);
      btn.classList.add("done");
      timerEl.textContent = "Đã Follow ✔";
      markDone();
      checkAll();
    }
  },1000);
}

function checkAll(){
  // CHỈ khi đủ 2 acc
  if(done1 && done2){
    loader.style.display="block";
    setTimeout(()=>{
      loader.style.display="none";
      script.style.display="block";
      copyBtn.style.display="block";
    },900);
  }
}

btn1.onclick = ()=> start(btn1, t1, ()=> done1=true);
btn2.onclick = ()=> start(btn2, t2, ()=> done2=true);

// 📋 COPY SCRIPT
function copyScript(){
  navigator.clipboard.writeText(script.innerText)
    .then(()=>alert("Đã copy script!"));
}

// 🔄 RESET MỖI LẦN RELOAD
window.addEventListener("beforeunload", ()=>{
  done1=false; done2=false;
});

// 🚫 CHẶN SOURCE ĐƠN GIẢN
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("keydown", e=>{
  if(
    e.key==="F12" ||
    (e.ctrlKey && e.key.toLowerCase()==="u") ||
    (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()))
  ){
    e.preventDefault();
  }
});
</script>
</body>
</html>
