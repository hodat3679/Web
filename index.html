<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sailor Piece Script</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at 30% 20%, #0ea5e9, transparent 40%),
radial-gradient(circle at 80% 70%, #22c55e, transparent 40%),
linear-gradient(180deg,#020617,#0c4a6e,#022c22);
color:#fef3c7;
overflow:hidden;
}

/* ✨ GLOW BACKGROUND */

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#facc15,transparent 60%);
filter:blur(120px);
opacity:.25;
animation:float 10s infinite alternate ease-in-out;
}

@keyframes float{
from{transform:translate(-20%, -10%)}
to{transform:translate(20%, 10%)}
}

/* 🌊 WAVES */

.wave{
position:fixed;
bottom:0;
left:0;
width:200%;
height:260px;
background:rgba(255,215,0,.12);
border-radius:45%;
animation:waveMove 10s linear infinite;
}

.wave2{
bottom:80px;
opacity:.35;
animation-duration:14s;
}

.wave3{
bottom:140px;
opacity:.2;
animation-duration:18s;
}

@keyframes waveMove{
0%{transform:translateX(0)}
100%{transform:translateX(-50%)}
}

/* CARD */

.container{
width:100%;
max-width:420px;
padding:20px;
z-index:2;
}

.card{
background:rgba(15,23,42,.75);
backdrop-filter:blur(14px);
border-radius:20px;
padding:30px;
box-shadow:0 0 80px rgba(0,0,0,.9);
border:2px solid rgba(250,204,21,.4);
}

/* TITLE */

h1{
text-align:center;
font-size:1.6rem;
margin-bottom:20px;
color:#facc15;
text-shadow:0 0 12px #facc15, 0 0 25px #fde047;
}

/* PROGRESS */

.progress{
height:16px;
background:rgba(255,255,255,.2);
border-radius:12px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#facc15,#fde047);
box-shadow:0 0 20px #facc15;
transition:.35s;
}

.percent{
text-align:center;
margin-top:6px;
font-size:.9rem;
}

/* BUTTONS */

.tiktok-list{
margin-top:20px;
display:flex;
flex-direction:column;
gap:14px;
}

.tiktok-btn{
text-decoration:none;
padding:16px;
border-radius:14px;
font-weight:700;
text-align:center;
color:#111827;
background:linear-gradient(135deg,#facc15,#fde68a);
transition:.25s;
border:2px solid #fbbf24;
box-shadow:0 0 15px rgba(250,204,21,.4);
}

.tiktok-btn:hover{
transform:scale(1.07);
box-shadow:0 0 25px #facc15;
}

.tiktok-btn.done{
background:linear-gradient(90deg,#22c55e,#4ade80);
color:white;
box-shadow:0 0 18px #22c55e;
}

.timer{
font-size:.8rem;
margin-top:6px;
}

/* SCRIPT BOX */

pre{
display:none;
margin-top:20px;
background:#020617;
border-radius:14px;
padding:18px;
color:#facc15;
font-size:.8rem;
overflow-x:auto;
animation:fade .7s ease;
border:1px solid #facc15;
}

@keyframes fade{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}
}

/* COPY BUTTON */

.copy-btn{
display:none;
margin-top:14px;
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-weight:700;
background:linear-gradient(90deg,#facc15,#fde047);
color:#111827;
cursor:pointer;
transition:.25s;
box-shadow:0 0 15px rgba(250,204,21,.5);
}

.copy-btn:hover{
transform:scale(1.07);
}

/* FOOTER */

.footer{
margin-top:18px;
text-align:center;
font-size:.75rem;
opacity:.9;
color:#fde68a;
}

</style>
</head>

<body>

<div class="wave"></div>
<div class="wave wave2"></div>
<div class="wave wave3"></div>

<div class="container">
<div class="card">

<h1>🏴‍☠️ Sailor Piece Script</h1>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="percent" id="percent">0%</div>

<div class="tiktok-list" id="tiktokGrid">

<a class="tiktok-btn" id="btn1"
href="https://www.tiktok.com/@scriptescapetsunami1?_r=1&_t=ZS-95FKdCeD3B7"
target="_blank">
Follow Tiktok 1
<div class="timer" id="t1"></div>
</a>

<a class="tiktok-btn" id="btn2"
href="https://www.tiktok.com/@scriptroblox40"
target="_blank">
Follow Tiktok 2
<div class="timer" id="t2"></div>
</a>

</div>

<pre id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/SailorPiece/refs/heads/main/AutoFarm"))()
</pre>

<button class="copy-btn" id="copyBtn" onclick="copyScript()">💰 Copy Treasure Script</button>

<div class="footer">© HdatScript — Sailor Piece</div>

</div>
</div>

<script>

const WAIT=5

let d1=false
let d2=false
let progress=0

function setProgress(p){
progress=Math.min(100,p)
bar.style.width=progress+"%"
percent.textContent=Math.floor(progress)+"%"
}

function start(btn,timer,done){

if(btn.classList.contains("done")) return

let t=WAIT
let step=50/WAIT

timer.textContent=`Scanning... ${t}s`

const iv=setInterval(()=>{

t--
setProgress(progress+step)
timer.textContent=`Scanning... ${t}s`

if(t<=0){
clearInterval(iv)
btn.classList.add("done")
timer.textContent="Completed ✔"
done()
setProgress(Math.round(progress/50)*50)
check()
}

},1000)

}

function check(){
if(d1 && d2){
tiktokGrid.style.display="none"
script.style.display="block"
copyBtn.style.display="block"
setProgress(100)
}
}

btn1.onclick=(e)=>{
e.preventDefault()
window.open(btn1.href,"_blank")
start(btn1,t1,()=>d1=true)
}

btn2.onclick=(e)=>{
e.preventDefault()
window.open(btn2.href,"_blank")
start(btn2,t2,()=>d2=true)
}

function copyScript(){
navigator.clipboard.writeText(script.innerText.trim())
.then(()=>{
copyBtn.innerText="🏆 Copied!"
setTimeout(()=>{
copyBtn.innerText="💰 Copy Treasure Script"
},2000)
})
}

</script>

</body>
</html>
