<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape Tsunami Brainrots Script</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#0f3f6b,#1b7fb8,#58b3db);
overflow:hidden;
}

/* waves */
body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle at 50% 50%,rgba(255,255,255,0.08),transparent 60%);
animation:wave 10s infinite linear;
}

@keyframes wave{
0%{transform:translateY(0)}
50%{transform:translateY(40px)}
100%{transform:translateY(0)}
}

/* card */

.card{
width:350px;
background:#0b3d53;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.5);
color:white;
}

.game-icon{
width:110px;
height:110px;
border-radius:20px;
margin:auto;
display:block;
box-shadow:0 0 25px #00eaff;
margin-bottom:15px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.progress{
width:100%;
height:12px;
background:#133f4d;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#21ff7a,#39e0ff);
transition:1s;
}

.percent{
margin-bottom:20px;
}

.script-box{
background:#061e33;
padding:12px;
border-radius:12px;
font-size:12px;
margin-bottom:20px;
word-break:break-all;
}

.copy-btn{
background:linear-gradient(90deg,#5ec9ff,#9ddfff);
border:none;
padding:12px;
width:100%;
border-radius:12px;
font-size:15px;
cursor:pointer;
transition:.3s;
}

.copy-btn:hover{
transform:scale(1.05);
}

.footer{
margin-top:15px;
font-size:12px;
opacity:.7;
}
</style>
</head>

<body>

<div class="card">

<img id="gameIcon" class="game-icon">

<div class="title">Escape Tsunami Brainrots Script</div>

<div class="progress">
<div id="bar" class="progress-bar"></div>
</div>

<div id="percent" class="percent">0%</div>

<div class="script-box" id="scriptBox" style="display:none">

loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/EscapeTsunami/refs/heads/main/ForBrainrots"))()

</div>

<button class="copy-btn" onclick="copyScript()">📋 Copy Script</button>

<div class="footer">
© HdatScript — Escape Tsunami Scripts
</div>

</div>

<script>

/* AUTO LOAD ROBLOX GAME ICON */

const placeId = "131623223084840";

fetch(`https://apis.roblox.com/universes/v1/places/${placeId}/universe`)
.then(res=>res.json())
.then(data=>{

let universe = data.universeId;

fetch(`https://thumbnails.roblox.com/v1/games/icons?universeIds=${universe}&size=256x256&format=Png&isCircular=false`)
.then(res=>res.json())
.then(icon=>{
document.getElementById("gameIcon").src = icon.data[0].imageUrl;
})

})

/* PROGRESS ANIMATION */

let p=0

let interval=setInterval(()=>{

p+=10
document.getElementById("bar").style.width=p+"%"
document.getElementById("percent").innerText=p+"%"

if(p>=100){
clearInterval(interval)
document.getElementById("scriptBox").style.display="block"
}

},400)

/* COPY */

function copyScript(){

let text=document.getElementById("scriptBox").innerText

navigator.clipboard.writeText(text)

alert("Script Copied!")

}

</script>

</body>
</html>
