<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptMM2 - Upgraded</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  color:#fff;
  background:#da251d;
  overflow-x:hidden;
  transition:background .3s, color .3s;
}
body.dark{
  background:#1a1a1a;
  color:#e0e0e0;
}

/* 🇻🇳 FLAG WAVE */
.flag{
  position:fixed;
  inset:0;
  background:#da251d;
  animation:wave 10s ease-in-out infinite;
  transform-origin:left center;
  z-index:-3;
}
body.dark .flag{
  background:#1a1a1a;
}
@keyframes wave{
  0%{transform:skewY(0deg)}
  25%{transform:skewY(-1deg)}
  50%{transform:skewY(0deg)}
  75%{transform:skewY(1deg)}
  100%{transform:skewY(0deg)}
}

/* ⭐ STAR */
.star{
  position:fixed;
  width:60vmin;
  max-width:380px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:.85;
  z-index:-2;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:720px;
  padding:18px;
}

/* CARD */
.card{
  background:rgba(0,0,0,.55);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,.6);
  transition:background .3s;
}
body.dark .card{
  background:rgba(255,255,255,.1);
}

/* TITLE */
h1{
  text-align:center;
  font-size:1.25rem;
  margin-bottom:14px;
  color:#ffd700;
}

/* DARK MODE TOGGLE */
.toggle{
  position:absolute;
  top:20px;
  right:20px;
  background:#333;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
  font-size:1.2rem;
}
body.dark .toggle{
  background:#ffd700;
  color:#000;
}

/* PROGRESS */
.progress-box{
  margin-bottom:18px;
}
.progress{
  height:14px;
  width:100%;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  transition:width .25s linear;
}
.percent{
  text-align:center;
  margin-top:6px;
  font-size:.85rem;
}

/* TIKTOK */
.tiktok-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.tiktok-btn{
  text-decoration:none;
  padding:18px;
  border-radius:16px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,#ff004f,#ffcc00);
  text-align:center;
  animation:pulse 2s infinite;
}
.tiktok-btn.done{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  animation:none;
}
.timer{
  font-size:.8rem;
  margin-top:6px;
}
.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #fff;
  border-top:2px solid transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-left:8px;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* SCRIPT SELECTOR */
.script-selector{
  margin-bottom:18px;
}
select{
  width:100%;
  padding:10px;
  border-radius:8px;
  background:#333;
  color:#fff;
  border:none;
}

/* SCRIPT */
pre{
  display:none;
  margin-top:18px;
  background:#020617;
  padding:16px;
  border-radius:14px;
  color:#7dd3fc;
  font-size:.8rem;
  overflow-x:auto;
  white-space:pre-wrap;
}

.copy-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:600;
  background:linear-gradient(90deg,#ffd700,#fff2a8);
  cursor:pointer;
}

/* SHARE BUTTONS */
.share-buttons{
  display:none;
  margin-top:14px;
  display:flex;
  gap:10px;
  justify-content:center;
}
.share-btn{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
}
.twitter{background:#1da1f2}
.facebook{background:#1877f2}

.footer{
  text-align:center;
  margin-top:14px;
  font-size:.75rem;
  opacity:.9;
}

/* DESKTOP */
@media(min-width:768px){
  h1{font-size:1.6rem}
  .tiktok-list{display:grid; grid-template-columns:1fr 1fr; gap:14px}
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleDarkMode()">🌙</button>

<div class="flag"></div>

<svg class="star" viewBox="0 0 100 100">
  <polygon fill="#ffd700"
  points="50,5 61,38 95,38 67,58 78,91 50,70 22,91 33,58 5,38 39,38"/>
</svg>

<div class="container">
  <div class="card">

    <h1>Follow TikTok to Unlock MM2Scripts</h1>

    <!-- SCRIPT SELECTOR -->
    <div class="script-selector">
      <select id="scriptSelect">
        <option value="zephyr">ZephyrScript</option>
        <option value="silent">SilentAim</option>
        <option value="esp">ESP Hack</option>
      </select>
    </div>

    <!-- PROGRESS -->
    <div class="progress-box">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>

    <!-- TIKTOK -->
    <div class="tiktok-list" id="tiktokGrid">
      <a class="tiktok-btn" id="btn1"
         href="https://www.tiktok.com/@mm2scriptontop?_r=1&_t=ZS-93aQ5NP6HP2"
         target="_blank">
        ⭐ Main TikTok
        <div class="timer" id="t1"></div>
      </a>

      <a class="tiktok-btn" id="btn2"
         href="https://www.tiktok.com/@scriptroblox40?_r=1&_t=ZS-93aQ7WsrBUi"
         target="_blank">
        🌙 Sub TikTok
        <div class="timer" id="t2"></div>
      </a>
    </div>

    <!-- SCRIPT -->
    <pre id="script"></pre>

    <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 Copy Script</button>

    <!-- SHARE BUTTONS -->
    <div class="share-buttons" id="shareButtons">
      <a class="share-btn twitter" href="https://twitter.com/intent/tweet?text=I%20unlocked%20MM2%20script!%20Check%20it%20out!" target="_blank">Share on Twitter</a>
      <a class="share-btn facebook" href="https://www.facebook.com/sharer/sharer.php?u=https://yourwebsite.com" target="_blank">Share on Facebook</a>
    </div>

    <div class="footer">© HdatScript - Upgraded</div>
  </div>
</div>

<script>
const WAIT = 5;
let d1 = false, d2 = false;
let progress = 0;
let lastCopyTime = 0;

const scripts = {
  zephyr: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/BestScript-netizen/MM2Scripts/refs/heads/main/ZephyrScript"))()',
  silent: 'loadstring(game:HttpGet("https://example.com/silentaim.lua"))()',
  esp: 'loadstring(game:HttpGet("https://example.com/esp.lua"))()'
};

function setProgress(p) {
  progress = Math.min(100, p);
  bar.style.width = progress + "%";
  percent.textContent = progress + "%";
}

function start(btn, timer, done) {
  if (btn.classList.contains("done")) return;
  timer.innerHTML = `Verifying... ${WAIT}s <div class="spinner"></div>`;
  let t = WAIT;
  let step = 50 / WAIT;
  const iv = setInterval(() => {
    t--;
    setProgress(progress + step);
    timer.innerHTML = `Verifying... ${t}s <div class="spinner"></div>`;
    if (t <= 0) {
      clearInterval(iv);
      btn.classList.add("done");
      timer.textContent = "Followed ✔";
      done();
      setProgress(Math.round(progress / 50) * 50);
      check();
      playSound('success');
    }
  }, 1000);
}

function check() {
  if (d1 && d2) {
    tiktokGrid.style.display = "none";
    updateScript();
    script.style.display = "block";
    copyBtn.style.display = "block";
    shareButtons.style.display = "flex";
    setProgress(100);
    launchConfetti();
  }
}

function updateScript() {
  const selected = scriptSelect.value;
  script.textContent = obfuscateScript(scripts[selected]);
}

function obfuscateScript(s) {
  // Simple obfuscation: reverse and base64 (easy to reverse)
  return btoa(s.split('').reverse().join(''));
}

function copyScript() {
  const now = Date.now();
  if (now - lastCopyTime < 2000) return; // Rate limit 2s
  lastCopyTime = now;
  const selected = scriptSelect.value;
  const cleanScript = scripts[selected];
  navigator.clipboard.writeText(cleanScript.trim())
    .then(() => {
      alert("Script copied!");
      playSound('copy');
    });
}

btn1.onclick = () => start(btn1, t1, () => d1 = true);
btn2.onclick = () => start(btn2, t2, () => d2 = true);

scriptSelect.onchange = () => {
  if (script.style.display === "block") updateScript();
};

function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const toggle = document.querySelector('.toggle');
  toggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}

function playSound(type) {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.frequency.setValueAtTime(type === 'success' ? 800 : 600, audioCtx.currentTime);
  gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.2);
}

function launchConfetti() {
  // Simple confetti effect (you can replace with a library like confetti.js)
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.style.position = 'fixed';
    confetti.style.width = '10px';
    confetti.style.height = '10px';
    confetti.style.background = ['#ffd700', '#ff004f', '#22c55e'][Math.floor(Math.random() * 3)];
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.top = '-10px';
    confetti.style.animation = 'fall 3s linear';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 3000);
  }
}

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.key === "F12" || (e.ctrlKey && ["u", "i", "j", "c"].includes(e.key.toLowerCase())))
    e.preventDefault();
});
</script>

</body>
</html>
